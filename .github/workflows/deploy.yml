name: Validate and deploy Workers
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: workers/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: workers/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm cf:types
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm deploy:check
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: workers
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_URL: ${{ vars.APP_URL }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      SSO_ISSUER: ${{ vars.SSO_ISSUER }}
      SSO_CLIENT_ID: ${{ vars.SSO_CLIENT_ID }}
      SSO_RESOURCE: ${{ vars.SSO_RESOURCE }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: workers/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: workers/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node scripts/configure-deploy.mjs
      - run: pnpm db:migrate:remote
      - run: pnpm build
      - name: Deploy one version with SSO secret
        env:
          SSO_CLIENT_SECRET: ${{ secrets.SSO_CLIENT_SECRET }}
          WEBHOOK_MASTER_KEY: ${{ secrets.WEBHOOK_MASTER_KEY }}
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          if (!process.env.SSO_CLIENT_SECRET) throw new Error('SSO_CLIENT_SECRET is required');
          if (!process.env.WEBHOOK_MASTER_KEY || Buffer.from(process.env.WEBHOOK_MASTER_KEY, 'base64').length !== 32) throw new Error('WEBHOOK_MASTER_KEY must be a base64-encoded 32-byte secret');
          writeFileSync(`${process.env.RUNNER_TEMP}/mail-secrets.json`, JSON.stringify({SSO_CLIENT_SECRET: process.env.SSO_CLIENT_SECRET, WEBHOOK_MASTER_KEY: process.env.WEBHOOK_MASTER_KEY}), {mode:0o600});
          JS
          trap 'rm -f "$RUNNER_TEMP/mail-secrets.json"' EXIT
          pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/mail-secrets.json"
